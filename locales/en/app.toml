# Strings owned by the app shell (apps/snapoleon: tray, jobs, notices, routing).
# Each view owns its own file; nothing under [app]
[app]
countdown = "Capturing in {n}"

[app.tray]
tooltip = "Snapoleon"
tooltip_recording = "Snapoleon: recording"
recent = "Recent captures"
no_recent = "No captures yet"
tools = "More tools"
colors = "Colors and measurements"
combine = "Combine images"
compare = "Compare images"
close_pins = "Close all pins"
unlock_pins = "Unlock pins"
quit = "Quit Snapoleon"

[app.job]
working = "Working"
capturing = "Capturing"
cancelled = "Cancelled"

[app.error]
window = "Could not open the window"
crashed = "A window hit a problem and was closed"
capture = "Could not capture the screen"
job = "Something went wrong"
no_pipeline = "There is no pipeline named {id}"
no_file = "File not found: {path}"
open_file = "Could not open the file"

[app.notice]
copy_link = "Copy link"
show_in_folder = "Show in folder"
settings_unreadable = "Settings could not be read"
settings_unreadable_body = "Snapoleon is using defaults and will not overwrite {path}. Fix or remove the file, then restart."

[app.hotkey]
conflict_title = "A hotkey could not be registered"
conflict_body = "{accel}: {reason}"
unavailable = "Global hotkeys are not available"

[app.recording]
disabled = "Recording is turned off by your administrator"
already = "A recording is already running"

[app.clipboard]
no_image = "The clipboard has no image"

[app.text]
title = "Recognised text"
none = "No text found"

[app.ipc]
no_answer = "Snapoleon did not answer in time"
