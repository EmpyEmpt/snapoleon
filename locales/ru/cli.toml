capture = "Сделать снимок экрана; без цели откроется выделение области"
record = "Записать экран; без цели откроется окно записи"
ocr = "Распознать текст на изображении"
qr = "Прочитать или нарисовать QR-код"
"qr.decode" = "Прочитать коды на изображении"
"qr.encode" = "Нарисовать QR-код в виде PNG"
upload = "Загрузить файл и вывести ссылку"
history = "Искать по истории снимков"
"history.search" = "Искать по тексту, приложению, заголовку окна, адресу или метке; без запроса покажет последние"
pipeline = "Показать конвейеры или запустить один из них"
"pipeline.list" = "Показать настроенные конвейеры"
"pipeline.run" = "Запустить конвейер для файла изображения"
list = "Показать мониторы или окна с номерами, идентификаторами и прямоугольниками для параметров съёмки"
"list.monitors" = "Подключённые дисплеи: номер, имя, прямоугольник в физических пикселях, масштаб"
"list.windows" = "Окна верхнего уровня, от переднего к заднему: идентификатор, приложение, заголовок, прямоугольник в физических пикселях"
doctor = "Проверить установку: версию, пути, запущенное приложение и разрешения"
install-cli = "Добавить в PATH команду snapoleon, которая запускает эту установку (macOS и Linux)"

[cli.arg]
background = "Запуститься в трее без окна"

[cli.arg.url]
url = "Ссылка snapoleon://"

[cli.arg.edit]
path = "Изображение или проект .snap"

[cli.arg.pin]
path = "Изображение для закрепления"

[cli.arg.capture]
region = "Снять прямоугольник рабочего стола, в физических пикселях"
window = "Снять окно, в заголовке которого есть этот текст"
monitor = "Снять один монитор (0 — основной)"
all = "Снять все мониторы одним изображением"
element = "Снять элемент интерфейса под курсором"
pipeline = "Запустить этот конвейер вместо простого сохранения"
out = 'Куда записать изображение («-» — в stdout)'
format = "Формат изображения (по умолчанию из --out, иначе из настроек)"
copy = "Ещё и поместить изображение в буфер обмена"
delay = "Подождать столько секунд перед съёмкой"
cursor = "Снять вместе с курсором мыши"
json = "Вывести результат в JSON"

[cli.arg.record]
region = "Записать прямоугольник рабочего стола, в физических пикселях"
window = "Записать окно, в заголовке которого есть этот текст"
monitor = "Записать один монитор (0 — основной)"
duration = "Остановиться через столько секунд (по умолчанию до Enter или Ctrl+C)"
format = "Формат видео (по умолчанию из --out, иначе из настроек)"
out = "Куда записать видео"

[cli.arg.ocr]
input = 'Файл изображения или «-», чтобы прочитать изображение из stdin'
markdown = "Вывести таблицу в Markdown"
tsv = "Вывести таблицу значениями через табуляцию"
json = "Вывести строки, слова и рамки в JSON"

[cli.arg."qr.decode"]
input = 'Файл изображения или «-», чтобы прочитать изображение из stdin'
json = "Вывести формат, текст и положение в JSON"

[cli.arg."qr.encode"]
text = "Текст для кодирования"
out = 'Куда записать изображение («-» — в stdout)'
size = "Пикселей на модуль"

[cli.arg.upload]
file = "Файл для загрузки"
destination = "Идентификатор места загрузки (по умолчанию основное)"
format = "В каком виде вывести ссылку (по умолчанию из настроек)"
copy = "Ещё и скопировать выведенную ссылку в буфер обмена"

[cli.arg."history.search"]
query = "Слова для поиска"
json = "Вывести записи в JSON"
limit = "Сколько результатов вернуть самое большее"

[cli.arg."pipeline.list"]
json = "Вывести конвейеры в JSON"

[cli.arg."pipeline.run"]
id = "Идентификатор конвейера"
image = "Файл изображения для обработки"
json = "Вывести результат в JSON"

[cli.help]
after = """
Примеры:
  snapoleon capture --monitor 0 --out shot.png
  snapoleon capture --window Calculator --json
  snapoleon ocr shot.png --json
  snapoleon list windows
  snapoleon doctor

Коды выхода: 0 — успех, 1 — ошибка, 2 — неверные аргументы.
Полное описание: https://github.com/EmpyEmpt/snapoleon/blob/main/docs/CLI.md"""

[cli.arg."list.monitors"]
json = "Вывести мониторы в JSON"

[cli.arg."list.windows"]
json = "Вывести окна в JSON"

[cli.arg.doctor]
json = "Вывести отчёт в JSON"

[cli.arg."install-cli"]
dir = "Папка для команды (по умолчанию /usr/local/bin в macOS, ~/.local/bin в Linux)"

[cli.list]
primary = "основной"
no_titles = "Заголовки окон пусты: у приложения, из которого запущена команда ({host}), нет разрешения на запись экрана. capture --window всё равно работает, потому что снимки идут через приложение Snapoleon."

[cli.doctor]
version = "Версия"
exe = "Исполняемый файл"
bundle = "Пакет приложения"
signature = "Подпись"
host_app = "Запущено из"
on_path = "В PATH"
portable = "Портативный режим"
app = "Приложение Snapoleon"
app_running = "запущено, pid {pid}, версия {version}"
app_unknown = "запущено, но не отвечает на запрос состояния (старая версия?)"
app_stopped = "не запущено"
permission = "Разрешение"
this_process = "Этот процесс"
app_column = "Приложение Snapoleon"
yes = "да"
no = "нет"
no_permissions = "Разрешения конфиденциальности в этой системе не нужны."

[cli.doctor.path]
settings = "Настройки"
data = "Данные"
history = "История"
log = "Журнал"

[cli.doctor.perm]
screen_recording = "Запись экрана"
accessibility = "Универсальный доступ"
input_monitoring = "Мониторинг ввода"
microphone = "Микрофон"

[cli.doctor.hint]
start_app = "Snapoleon не запущен. Откройте его один раз, чтобы выдать разрешения; после этого снимки из командной строки сами запустят его в фоне и пойдут через него."
app_screen = "Snapoleon пока не может делать снимки: включите его в Системных настройках > Конфиденциальность и безопасность > Запись экрана и системного звука, затем закройте и снова откройте Snapoleon."
app_relaunch = "Snapoleon пока не может делать снимки. Если вы только что включили его в Системных настройках > Конфиденциальность и безопасность > Запись экрана и системного звука, macOS применит это только после перезапуска: выполните snapoleon quit и снова откройте Snapoleon."
bare_binary = "Это отдельный исполняемый файл, а не Snapoleon.app, поэтому macOS выдаёт ему разрешения приложения, из которого он запущен. Соберите приложение скриптом packaging/macos/bundle.sh."
install_cli = "Команды snapoleon нет в PATH. Выполните snapoleon install-cli или установите её в Настройках > Дополнительно > Инструмент командной строки."

[cli.install]
windows = "Установщик для Windows уже добавляет Snapoleon в PATH."
exists = "{path} уже существует и установлен не Snapoleon. Удалите его или выберите другую папку через --dir."
not_on_path = "Папки {dir} нет в PATH. Добавьте её в профиль оболочки, чтобы запускать snapoleon откуда угодно."
temporary = "Snapoleon запущен с образа диска или из временной копии. Перенесите Snapoleon.app в папку «Программы», откройте его оттуда и установите команду ещё раз."

[macos.cli.arg]
background = "Запуститься в строке меню без окна"
