[cli]
about = "Снимки экрана, запись, распознавание текста и обмен"

[cli.error]
line = "Ошибка: {message}"
no_command = "Делать нечего. Список команд покажет snapoleon --help."
need_target = "Выберите, что снимать: --region, --window, --monitor, --all или --element."
needs_app = "Эту команду выполняет приложение Snapoleon, а оно не запущено."
bad_region = "Нужны четыре целых числа: x,y,w,h. Ширина и высота должны быть больше нуля."

[cli.record]
started = "Идёт запись. Чтобы остановить, нажмите Enter или Ctrl+C."
started_timed = "Идёт запись."

[cli.ocr]
no_table = "В изображении не нашлось таблицы."

[cli.qr]
none_found = "В изображении не нашлось кода."

[cli.cmd]
url = "Открыть ссылку snapoleon://"
edit = "Открыть изображение или проект в редакторе"
pin = "Закрепить изображение на экране"
settings = "Открыть настройки"
quit = "Завершить запущенное приложение"
mcp = "Запустить MCP-сервер на stdio"
capture = "Сделать снимок экрана; без цели откроется выделение области"
record = "Записать экран; без цели откроется окно записи"
ocr = "Распознать текст на изображении"
qr = "Прочитать или нарисовать QR-код"
"qr.decode" = "Прочитать коды на изображении"
"qr.encode" = "Нарисовать QR-код в виде PNG"
upload = "Загрузить файл и вывести ссылку"
history = "Искать по истории снимков"
"history.search" = "Искать по тексту, приложению, заголовку окна, адресу или метке; без запроса покажет последние"
pipeline = "Показать конвейеры или запустить один из них"
"pipeline.list" = "Показать настроенные конвейеры"
"pipeline.run" = "Запустить конвейер для файла изображения"

[cli.arg]
background = "Запуститься в трее без окна"

[cli.arg.url]
url = "Ссылка snapoleon://"

[cli.arg.edit]
path = "Изображение или проект .snap"

[cli.arg.pin]
path = "Изображение для закрепления"

[cli.arg.capture]
region = "Снять прямоугольник рабочего стола, в физических пикселях"
window = "Снять окно, в заголовке которого есть этот текст"
monitor = "Снять один монитор (0 — основной)"
all = "Снять все мониторы одним изображением"
element = "Снять элемент интерфейса под курсором"
pipeline = "Запустить этот конвейер вместо простого сохранения"
out = 'Куда записать изображение («-» — в stdout)'
format = "Формат изображения (по умолчанию из --out, иначе из настроек)"
copy = "Ещё и поместить изображение в буфер обмена"
delay = "Подождать столько секунд перед съёмкой"
cursor = "Снять вместе с курсором мыши"

[cli.arg.record]
region = "Записать прямоугольник рабочего стола, в физических пикселях"
window = "Записать окно, в заголовке которого есть этот текст"
monitor = "Записать один монитор (0 — основной)"
duration = "Остановиться через столько секунд (по умолчанию до Enter или Ctrl+C)"
format = "Формат видео (по умолчанию из --out, иначе из настроек)"
out = "Куда записать видео"

[cli.arg.ocr]
input = 'Файл изображения или «-», чтобы прочитать изображение из stdin'
markdown = "Вывести таблицу в Markdown"
tsv = "Вывести таблицу значениями через табуляцию"
json = "Вывести строки, слова и рамки в JSON"

[cli.arg."qr.decode"]
input = 'Файл изображения или «-», чтобы прочитать изображение из stdin'
json = "Вывести формат, текст и положение в JSON"

[cli.arg."qr.encode"]
text = "Текст для кодирования"
out = 'Куда записать изображение («-» — в stdout)'
size = "Пикселей на модуль"

[cli.arg.upload]
file = "Файл для загрузки"
destination = "Идентификатор места загрузки (по умолчанию основное)"
format = "В каком виде вывести ссылку (по умолчанию из настроек)"
copy = "Ещё и скопировать выведенную ссылку в буфер обмена"

[cli.arg."history.search"]
query = "Слова для поиска"
json = "Вывести записи в JSON"
limit = "Сколько результатов вернуть самое большее"

[cli.arg."pipeline.list"]
json = "Вывести конвейеры в JSON"

[cli.arg."pipeline.run"]
id = "Идентификатор конвейера"
image = "Файл изображения для обработки"
json = "Вывести результат в JSON"

[macos.cli.arg]
background = "Запуститься в строке меню без окна"
