[app.stub]
body = "Это окно ещё не готово."

[app.stub.about]
title = "О программе"

[app.stub.onboarding]
title = "Добро пожаловать"

[app.stub.library]
title = "Библиотека"

[app.stub.text]
title = "Текст"

[app.stub.video]
title = "Видеоредактор"

[app.stub.combine]
