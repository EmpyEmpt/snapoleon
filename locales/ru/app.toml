# Строки оболочки приложения (apps/snapoleon: трей, задачи, уведомления, маршрутизация).
# У каждого окна свой файл; всё в [app.stub] исчезнет вместе с заглушками.

[app]
countdown = "Снимок через {n}"

[app.tray]
tooltip = "Snapoleon"
tooltip_recording = "Snapoleon: идёт запись"
recent = "Недавние снимки"
no_recent = "Снимков пока нет"
quit = "Выйти из Snapoleon"

[app.job]
working = "Выполняется"
capturing = "Снимаем"
cancelled = "Отменено"

[app.error]
window = "Не удалось открыть окно"
capture = "Не удалось сделать снимок экрана"
job = "Что-то пошло не так"
no_pipeline = "Сценария с именем {id} нет"
no_file = "Файл не найден: {path}"
open_file = "Не удалось открыть файл"

[app.notice]
copy_link = "Скопировать ссылку"
show_in_folder = "Показать в папке"

[app.hotkey]
conflict_title = "Не удалось назначить сочетание клавиш"
conflict_body = "{accel}: {reason}"
unavailable = "Глобальные сочетания клавиш недоступны"

[app.recording]
disabled = "Запись экрана отключена администратором"
already = "Запись уже идёт"

[app.clipboard]
no_image = "В буфере обмена нет изображения"

[app.text]
