[package]
name = "snap-record"
description = "Screen recording to MP4/GIF/WebP with audio and input overlays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snap-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
image.workspace = true
ab_glyph = "0.2"
color_quant = "1.1"
cpal = "0.18"
gif = "0.14"
libwebp-sys = "0.9"
rdev = "0.5"
tiny-skia = "0.12"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-avf-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
