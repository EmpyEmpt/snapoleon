[package]
name = "snap-engine"
description = "Headless orchestration: pipelines, capture flows, CLI and MCP backends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snap-core.workspace = true
snap-capture.workspace = true
snap-image.workspace = true
snap-annotate.workspace = true
snap-ocr.workspace = true
snap-redact.workspace = true
snap-upload.workspace = true
snap-history.workspace = true
snap-platform.workspace = true
snap-record.workspace = true
snap-ai.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = "3"
ab_glyph = "0.2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["record"] }

[dev-dependencies]
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
