# Run from this directory:  docker compose up -d --build
# The first start prints the bootstrap admin password and API token:  docker compose logs snapoleon
services:
  snapoleon:
    build:
      context: ../../..
      dockerfile: server/snapoleon-server/deploy/Dockerfile
    image: snapoleon-server:latest
    restart: unless-stopped
    ports:
      # Loopback only: put a reverse proxy (Caddy, nginx) in front. Publishing this port to the
      # network would let clients talk to the server directly.
      - "127.0.0.1:8787:8787"
    volumes:
      - snapoleon-data:/data
    environment:
      # Public address used in links and link previews (your domain, with https).
      SNAPOLEON_PUBLIC_URL: "https://snap.example.com"
      SNAPOLEON_MAX_UPLOAD_MB: "200"
      SNAPOLEON_REGISTRATION: "closed"
      # Client IPs are read from the proxy's X-Forwarded-For only when the connection comes from one of
      # these networks (the host's loopback and Docker's bridge). Set SNAPOLEON_PROXY_HEADER for
      # proxies that use another header (CF-Connecting-IP, X-Real-IP) and widen the list if the proxy
      # lives elsewhere.
      SNAPOLEON_TRUSTED_PROXIES: "127.0.0.1,::1,172.16.0.0/12"
      # Uncomment to store files in an S3-compatible bucket instead of the volume.
      # SNAPOLEON_STORAGE: "s3"
      # SNAPOLEON_S3_ENDPOINT: "https://<account>.r2.cloudflarestorage.com"
      # SNAPOLEON_S3_BUCKET: "snapoleon"
      # SNAPOLEON_S3_REGION: "auto"
      # SNAPOLEON_S3_KEY: "..."
      # SNAPOLEON_S3_SECRET: "..."
      # Uncomment for single sign-on.
      # SNAPOLEON_OIDC_ISSUER: "https://idp.example.com/realms/team"
      # SNAPOLEON_OIDC_CLIENT_ID: "snapoleon"
      # SNAPOLEON_OIDC_CLIENT_SECRET: "..."
      # SNAPOLEON_OIDC_ADMIN_GROUP: "snapoleon-admins"

volumes:
  snapoleon-data:
