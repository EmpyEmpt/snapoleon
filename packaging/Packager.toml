# cargo-packager configuration for Snapoleon.
#
#   cargo build --release -p snapoleon
#   cargo packager --config packaging/Packager.toml --release --formats nsis
#
# Paths are relative to this file (packaging/); run cargo-packager from the repository root.
# The portable zip is not a cargo-packager format; packaging/windows/make-portable.ps1 builds it.

name = "snapoleon"
product-name = "Snapoleon"
identifier = "app.snapoleon"
version = "0.1.0" # the release workflow writes the Cargo.toml version here, after checking it matches the tag
description = "Screenshots, screen recording, OCR and sharing in one small Rust app"
long-description = """
Snapoleon is a screenshot, screen recording, OCR and sharing tool written entirely in Rust.
One hotkey selects a region and opens an instant toolbar; pipelines, destinations, a CLI and an
MCP server sit behind it for people who want them. Private by default, with self-hostable links.
"""
homepage = "https://github.com/EmpyEmpt/snapoleon"
authors = ["The Snapoleon contributors"]
publisher = "Snapoleon"
copyright = "Copyright (c) The Snapoleon contributors"
license-file = "../LICENSE-MIT"
category = "GraphicsAndDesign"

out-dir = "../target/packager"
binaries-dir = "../target/release"
binaries = [{ path = "snapoleon", main = true }]

icons = [
  "../assets/brand/snapoleon-32.png",
  "../assets/brand/snapoleon-128.png",
  "../assets/brand/snapoleon-256.png",
  "../assets/brand/snapoleon-512.png",
  "windows/snapoleon.ico",
  "macos/snapoleon.icns",
]

# The release workflow picks the formats for each host with --formats.
formats = ["nsis", "wix", "app", "dmg", "appimage", "deb"]

[[file-associations]]
extensions = ["snap"]
mime-type = "application/vnd.snapoleon.project+zip"
description = "Snapoleon project"
name = "Snapoleon project"
role = "editor"

[[deep-link-protocols]]
schemes = ["snapoleon"]
role = "viewer"

# ---------------------------------------------------------------- Windows

[nsis]
# Per-user install under %LOCALAPPDATA%, no UAC prompt.
installer-mode = "currentUser"
languages = ["English", "Russian"]
display-language-selector = false
installer-icon = "windows/snapoleon.ico"
# Solid LZMA is the strongest compression NSIS offers (smaller than zlib/bzip2 on the 28 MB exe).
compression = "lzma"
# Patched copy of cargo-packager 0.11.8's installer.nsi (see the header of that file for the changes).
template = "windows/installer.nsi"
# Authenticode signing is done by the release workflow (Azure Trusted Signing) after packaging.

[wix]
# Per-machine MSI for IT deployment (needs elevation): msiexec /i Snapoleon.msi /qn. Installs to Program Files.
# cargo-packager's WiX template hard-codes InstallScope="perMachine" and HKLM registrations; the per-user
# installer is the NSIS setup.exe. One language only: every extra language emits another .msi and the
# release workflow publishes a single file per architecture (the installer UI is English).
languages = ["en-US"]

# ---------------------------------------------------------------- macOS

[macos]
minimum-system-version = "14.0" # ScreenCaptureKit screenshots (SCScreenshotManager)
info-plist-path = "macos/Info.plist"
entitlements = "macos/entitlements.plist"
background-app = true # LSUIElement
# The release workflow adds signing-identity here: the Developer ID from APPLE_SIGNING_IDENTITY, or "-" (ad-hoc)
# without one, so the bundle is always signed as app.snapoleon with its Info.plist bound, which TCC needs.

[dmg]
window-size = { width = 640, height = 400 }
app-position = { x = 180, y = 190 }
application-folder-position = { x = 460, y = 190 }

# ---------------------------------------------------------------- Linux

[deb]
# PipeWire 1.0 (Ubuntu 24.04, Debian 13 or newer) is required by the capture backend.
depends = [
  "libxcb1",
  "libx11-6",
  "libxcursor1",
  "libxi6",
  "libxtst6",
  "libxkbcommon-x11-0",
  "libegl1",
  "libgbm1",
  "libasound2t64 | libasound2",
  "libpipewire-0.3-0t64 (>= 1.0) | libpipewire-0.3-0 (>= 1.0)",
  "libdbus-1-3",
  "libxkbcommon0",
  "libwayland-client0",
]
section = "graphics"
priority = "optional"
desktop-template = "linux/app.snapoleon.Snapoleon.desktop"

[deb.files]
"linux/app.snapoleon.Snapoleon.metainfo.xml" = "/usr/share/metainfo/app.snapoleon.Snapoleon.metainfo.xml"
"linux/icons/hicolor/scalable/apps/app.snapoleon.Snapoleon.svg" = "/usr/share/icons/hicolor/scalable/apps/app.snapoleon.Snapoleon.svg"
"linux/icons/hicolor/256x256/apps/app.snapoleon.Snapoleon.png" = "/usr/share/icons/hicolor/256x256/apps/app.snapoleon.Snapoleon.png"
"linux/icons/hicolor/48x48/apps/app.snapoleon.Snapoleon.png" = "/usr/share/icons/hicolor/48x48/apps/app.snapoleon.Snapoleon.png"
"linux/app.snapoleon.Snapoleon.mime.xml" = "/usr/share/mime/packages/app.snapoleon.Snapoleon.xml"
"policy/policy.toml.example" = "/etc/snapoleon/policy.toml.example"

[appimage]
# PipeWire, D-Bus and Wayland libraries come from the host system.

[appimage.files]
# The desktop file says Icon=app.snapoleon.Snapoleon, but cargo-packager only installs the icons as
# snapoleon.png. linuxdeploy then fails with "Could not find suitable icon" (exit 1). Ship the
# reverse-DNS names that the desktop file refers to.
"linux/icons/hicolor/scalable/apps/app.snapoleon.Snapoleon.svg" = "usr/share/icons/hicolor/scalable/apps/app.snapoleon.Snapoleon.svg"
"linux/icons/hicolor/256x256/apps/app.snapoleon.Snapoleon.png" = "usr/share/icons/hicolor/256x256/apps/app.snapoleon.Snapoleon.png"
"linux/icons/hicolor/48x48/apps/app.snapoleon.Snapoleon.png" = "usr/share/icons/hicolor/48x48/apps/app.snapoleon.Snapoleon.png"
