ShortDescription: Screenshots, screen recording, OCR and sharing in one small Rust app.
Description: |-
  Snapoleon is a screenshot and screen recording tool written entirely in Rust. One hotkey selects a
  region and opens an instant toolbar; pipelines, upload destinations, a command line interface and an
  MCP server are there when you need them. Includes an annotation editor, scrolling capture, OCR,
  QR and barcode decoding, automatic redaction and a searchable history. Private by default.
