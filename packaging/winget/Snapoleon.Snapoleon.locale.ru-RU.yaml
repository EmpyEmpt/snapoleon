ShortDescription: Скриншоты, запись экрана, OCR и обмен ссылками в одной небольшой программе на Rust.
Description: |-
  Snapoleon - программа для скриншотов и записи экрана, целиком написанная на Rust. Одна горячая клавиша
  выделяет область и открывает панель инструментов; конвейеры, места загрузки, командная строка и
  MCP-сервер доступны, когда нужны. Есть редактор аннотаций, прокручиваемый снимок, OCR, чтение QR-кодов
  и штрихкодов, автоматическое скрытие данных и история с поиском. Приватность по умолчанию.
