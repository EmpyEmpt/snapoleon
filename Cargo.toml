[workspace]
resolver = "3"
members = [
    "crates/snap-core",
    "crates/snap-capture",
    "crates/snap-image",
    "crates/snap-annotate",
    "crates/snap-ocr",
    "crates/snap-redact",
    "crates/snap-upload",
    "crates/snap-history",
    "crates/snap-platform",
    "crates/snap-record",
    "crates/snap-ai",
    "crates/snap-ui",
    "crates/snap-shell",
    "crates/snap-engine",
    "apps/snapoleon",
    "server/snapoleon-server",
]
default-members = ["apps/snapoleon"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EmpyEmpt/snapoleon"
rust-version = "1.95"

[workspace.dependencies]
snap-core = { path = "crates/snap-core" }
snap-capture = { path = "crates/snap-capture" }
snap-image = { path = "crates/snap-image" }
snap-annotate = { path = "crates/snap-annotate" }
snap-ocr = { path = "crates/snap-ocr" }
snap-redact = { path = "crates/snap-redact" }
snap-upload = { path = "crates/snap-upload" }
snap-history = { path = "crates/snap-history" }
snap-platform = { path = "crates/snap-platform" }
snap-record = { path = "crates/snap-record" }
snap-ai = { path = "crates/snap-ai" }
snap-ui = { path = "crates/snap-ui" }
snap-shell = { path = "crates/snap-shell", default-features = false }
snap-engine = { path = "crates/snap-engine" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
egui = "0.37"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-cache", "perf-literal"] }
directories = "6"
base64 = "0.22"
rand = "0.9"
# One pool of long-lived workers instead of fresh threads per capture: an OpenGL driver keeps about 90 KB per thread ever created.
rayon = "1"

[profile.release]
# Size first: the installer is the first thing a user meets. The pixel loops and the text rasteriser below are the
# exceptions; `z` was measured 1.3 MB smaller than `s` for the whole tree.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, not aborting: the tray app is resident, and a bug in one window's view should cost that window
# (`App::with_view` catches the panic and closes it), not every hotkey until the user notices and restarts it.

# Hot pixel code stays at full speed: image processing and encoding, OCR/barcode preprocessing, recording, rasterizing.
[profile.release.package.snap-image]
opt-level = 3
[profile.release.package.snap-annotate]
opt-level = 3
[profile.release.package.snap-ocr]
opt-level = 3
[profile.release.package.snap-record]
opt-level = 3
[profile.release.package.fast_image_resize]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.ab_glyph]
opt-level = 3
[profile.release.package.ab_glyph_rasterizer]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.weezl]
opt-level = 3
[profile.release.package.color_quant]
opt-level = 3
[profile.release.package.libwebp-sys]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3

# egui's glyph rasteriser leans on inlined SIMD wrappers, which `z` would stop inlining.
[profile.release.package.fearless_simd]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.epaint]
opt-level = "s"

# CI proves every target compiles and links; release-grade optimisation is the release workflow's job.
[profile.ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
